<!-- Sign-in email: a code for the installed phone app (it keeps its own storage, so a link opened from the
     mail app signs in the browser instead) and a link for a normal browser. Paste this into
     Supabase → Authentication → Emails → Magic Link. -->
<div dir="rtl" style="font-family: -apple-system, 'Segoe UI', Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1c1c1e; text-align: right;">
  <h2 style="margin: 0 0 12px; font-size: 22px;">כניסה להמתכונים שלנו</h2>
  <p style="margin: 0 0 8px; font-size: 16px;">באפליקציה בטלפון, הזינו את הקוד:</p>
  <p dir="ltr" style="margin: 0 0 24px; font-size: 34px; font-weight: 800; letter-spacing: 8px; text-align: center; background: #f2f2f7; border-radius: 12px; padding: 14px 0;">{{ .Token }}</p>
  <p style="margin: 0 0 8px; font-size: 16px;">בדפדפן במחשב, אפשר פשוט ללחוץ:</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #ff9500; color: #1b1206; font-weight: 700; text-decoration: none; padding: 12px 24px; border-radius: 12px;">כניסה</a>
  </p>
  <p style="margin: 0; font-size: 13px; color: #6c6c70;">הקוד והקישור תקפים לזמן קצר ולשימוש אחד. אם לא ביקשתם להיכנס, אפשר להתעלם מהמייל.</p>
</div>
