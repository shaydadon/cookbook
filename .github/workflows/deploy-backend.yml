name: Deploy backend

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:unit
      - run: npx supabase start
      # test:db must run before the integration tests: they leave rows behind that break rls.test.sql counts.
      - run: npm run test:db
      # The admin/push integration tests need `functions serve`, so they are excluded here.
      - run: npm run test:integration -- --filter "/worker|variants|delivered|two links/"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Skip when secrets are missing
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Supabase secrets not set; skipping deploy"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip != 'true'
        run: npx supabase link --project-ref "$PROJECT_REF"
      - if: steps.guard.outputs.skip != 'true'
        run: npx supabase db push
      - if: steps.guard.outputs.skip != 'true'
        run: npx supabase functions deploy --project-ref "$PROJECT_REF"
